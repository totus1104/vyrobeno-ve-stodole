<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galerie — ukázky zakázkové výroby | Vyrobeno ve stodole</title>
    <meta
      name="description"
      content="Fotogalerie dokončených zakázek z masivního dřeva. Prohlédněte si ukázky nábytku a dalších výrobků ze Stodoly."
    />
    <link rel="stylesheet" href="./src/styles.css" />
    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/gallery.js"></script>
  </head>
  <body>
    <!--site-header-->
    <main id="obsah" tabindex="-1">
      <h1 class="visually-hidden">Galerie</h1>
      <section class="gallery" aria-label="Fotografie dokončených projektů">
        <div class="container gallery-grid">
          <div class="gallery-row">
            <figure class="gallery-item" aria-labelledby="gallery-bench-title">
              <img
                src="./src/assets/images/dubova-lavice.jpg"
                alt="Dubová zahradní lavice s laťkovým opěradlem na upraveném trávníku."
                width="1551"
                height="1014"
                loading="lazy"
                decoding="async"
              />
              <figcaption class="gallery-caption">
                <h2 id="gallery-bench-title">Dubová lavice</h2>
              </figcaption>
              <template class="gallery-description">
                <p>Robustní lavice k jídelním stolu z dubového dřeva. </p>
              </template>
            </figure>
            <figure class="gallery-item" aria-labelledby="gallery-table-title">
              <img
                src="./src/assets/images/stolek-pro-millennium-falkon.jpg"
                alt="Tmavý dřevěný stolek s průhlednou skleněnou deskou a modelem Millennium Falcon uvnitř."
                width="1500"
                height="1095"
                loading="lazy"
                decoding="async"
              />
              <figcaption class="gallery-caption">
                <h2 id="gallery-table-title">Stolek pro Millennium Falcon</h2>
              </figcaption>
              <template class="gallery-description">
                <p>Prosklený konferenční stolek, vyrobený přesně na míru modelu - nejdřív loď a potom stůl. 
                  Materiál smrk, povrch od Remmers, deska 10mm tvrzené sklo.</p>
              </template>
            </figure>
          </div>
          <div class="gallery-row gallery-row--mixed">
            <figure class="gallery-item" aria-labelledby="gallery-bridge-title">
              <img
                src="./src/assets/images/modrinova-lavka.jpg"
                alt="Modřínová lávka."
                width="1125"
                height="1500"
                loading="lazy"
                decoding="async"
              />
              <figcaption class="gallery-caption">
                <h2 id="gallery-bridge-title">Modřínová lávka</h2>
              </figcaption>
              <template class="gallery-description">
                <p>Vánoční tesařský skvost. Modřínová lávka k Poustevně uprostřed lesů. 
                  Modřín je velice těžké dřevo, ale vydrží venkovní podmínky.</p>
              </template>
            </figure>
            <figure class="gallery-item" aria-labelledby="gallery-maple-bed-title">
              <img
                src="./src/assets/images/javorova-postel.jpg"
                alt="Světlý javorový rám postele s dřevěným roštem a čelem ze čtyř prken."
                width="1448"
                height="1086"
                loading="lazy"
                decoding="async"
              />
              <figcaption class="gallery-caption">
                <h2 id="gallery-maple-bed-title">Javorová postel</h2>
              </figcaption>
              <template class="gallery-description">
                <p>Postel z javorového dřeva. Na první pohled lehká a zářící, na dotek pevná a robustní.</p>
              </template>
            </figure>
          </div>
          <div class="gallery-row gallery-row--mixed gallery-row--landscape-first">
            <figure class="gallery-item" aria-labelledby="gallery-bookcase-title">
              <img
                src="./src/assets/images/knihovna-s-pracovnim-stolem.jpg"
                alt="Dřevěná knihovna s pracovním stolem a drobnou květinou na desce."
                width="1649"
                height="954"
                loading="lazy"
                decoding="async"
              />
              <figcaption class="gallery-caption">
                <h2 id="gallery-bookcase-title">Knihovna s pracovním stolem</h2>
              </figcaption>
              <template class="gallery-description">
                <p><!-- Sem napište popis realizace. --></p>
              </template>
            </figure>
            <figure class="gallery-item" aria-labelledby="gallery-board-doors-title">
              <img
                src="./src/assets/images/palubkove-dvere-s-kulatym-prosklenim.jpg"
                alt="Modrošedé dvoukřídlé palubkové dveře s kulatými okny a pootevřeným pravým křídlem."
                width="1086"
                height="1448"
                loading="lazy"
                decoding="async"
              />
              <figcaption class="gallery-caption">
                <h2 id="gallery-board-doors-title">Palubkové dveře s kulatým prosklením</h2>
              </figcaption>
              <template class="gallery-description">
                <p>Variace na námořnické téma. Dvoukřídlé zateplené dveře s izolačními dvojskly. Obložková zárubeň. 
                  Materiál smrk, povrch oblíbená modrá lazura.</p>
              </template>
            </figure>
          </div>
          <div class="gallery-row">
            <figure class="gallery-item" aria-labelledby="gallery-oak-bed-title">
              <img
                src="./src/assets/images/dubova-postel-s-osvetlenim.jpg"
                alt="Dubová postel se zabudovaným osvětlením v čele."
                width="1672"
                height="941"
                loading="lazy"
                decoding="async"
              />
              <figcaption class="gallery-caption">
                <h2 id="gallery-oak-bed-title">Dubová postel s osvětlením</h2>
              </figcaption>
              <template class="gallery-description">
                <p>Dubová postel, co vydrží po generace do městského stylu s integrovaným osvětlením, 
                  elektrickými zásuvkami a úložným prostorem v místě opěrky. </p>
              </template>
            </figure>
          </div>
        </div>
      </section>
      <dialog class="gallery-dialog" aria-labelledby="gallery-dialog-title">
        <div class="gallery-dialog-photo"></div>
        <div class="gallery-dialog-panel">
          <div class="gallery-dialog-header">
            <h2 id="gallery-dialog-title"></h2>
            <form method="dialog">
              <button class="gallery-close" type="submit" aria-label="Zavřít" autofocus>×</button>
            </form>
          </div>
          <div class="gallery-dialog-description" hidden>
            <div class="gallery-description-content"></div>
          </div>
          <div class="gallery-description-pages" role="group" aria-label="Stránky popisu" hidden>
            <button type="button">Předchozí</button>
            <span aria-live="polite"></span>
            <button type="button">Další</button>
          </div>
        </div>
      </dialog>
      <hr class="section-divider" />
      <section class="container cta">
        <h2>Líbí se Vám moje práce? Nechte si vyrobit vlastní produkt!</h2>
        <a class="button" href="./kontakt.html">
          Napište mi
          <span aria-hidden="true">↗</span>
        </a>
      </section>
    </main>
    <!--site-footer-->
  </body>
</html>
